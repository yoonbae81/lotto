name: Lotto Purchase (Run on GitHub)

on:
  workflow_dispatch:
  schedule:
    # TEMPORARY TEST: Saturday 09:25 KST (= 00:25 UTC). Restore to '0 0 * * 1' (Mon 09:00 KST) after the test.
    - cron: '25 0 * * 6'

permissions:
  contents: read

concurrency:
  group: lotto-purchase
  cancel-in-progress: false

jobs:
  purchase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read by the scripts from the environment (python-dotenv does not override these).
      USER_ID: ${{ secrets.USER_ID }}
      PASSWD: ${{ secrets.PASSWD }}
      CHARGE_PIN: ${{ secrets.CHARGE_PIN }}
      AUTO_GAMES: ${{ vars.AUTO_GAMES }}
      MANUAL_NUMBERS: ${{ vars.MANUAL_NUMBERS }}
      REPORTER_DISCORD_WEBHOOK: ${{ vars.REPORTER_DISCORD_WEBHOOK }}
      PYTHONPATH: src
      VENV_PYTHON: python
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run purchase workflow
        run: bash scripts/run.sh
